name: Concat dimension regression
on:
  push:
    branches: [fix/unsigned-concat-dim]
  pull_request:
    branches: [fix/unsigned-concat-dim]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install CPU dependencies and fork
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest .
      - name: Test concat dimensions
        run: python -m pytest -q tests/test_unsigned_concat_dim.py
